name: Test AWS OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get GitHub OIDC Token Claims
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log("========== OIDC CLAIMS ==========");
            console.log("iss:", payload.iss);
            console.log("aud:", payload.aud);
            console.log("sub:", payload.sub);
            console.log("repository:", payload.repository);
            console.log("repository_id:", payload.repository_id);
            console.log("repository_owner:", payload.repository_owner);
            console.log("repository_owner_id:", payload.repository_owner_id);
            console.log("ref:", payload.ref);
            console.log("event_name:", payload.event_name);
            console.log("=================================");

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Check AWS identity
        run: aws sts get-caller-identity
