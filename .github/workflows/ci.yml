name: CI Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-package:
    name: Run Tests and Build JAR Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Maven lifecycle step: 'mvn clean package' automatically executes the test goal 
      # ('mvn test') first. If any test fails, Maven stops and does NOT build the JAR.
      - name: Run Maven Test Suite & Build JAR
        run: mvn clean package
